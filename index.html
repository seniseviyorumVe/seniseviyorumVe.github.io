<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arşivlendi</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;

      background:
        radial-gradient(circle at top, #ffffff 0%, #f4f4f4 45%, #e9e9e9 100%);

      color: #1d1d1f;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
    }

    .card {
      width: 100%;
      max-width: 680px;
      padding: 56px 40px;

      background: rgba(255, 255, 255, 0.88);
      border: 1px solid #dddddd;
      border-radius: 24px;

      text-align: center;

      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.08);
    }

    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 28px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;
      background: #f0f0f0;
      border: 1px solid #dedede;

      font-size: 28px;
    }

    h1 {
      font-size: clamp(36px, 8vw, 64px);
      line-height: 1.05;
      font-weight: 700;
      letter-spacing: -2px;
      margin-bottom: 24px;
      color: #111111;
    }

    p {
      max-width: 500px;
      margin: 0 auto;

      font-size: clamp(16px, 4vw, 19px);
      line-height: 1.7;
      color: #555555;
    }

    .divider {
      width: 48px;
      height: 2px;
      margin: 32px auto;
      background: #c9c9c9;
      border-radius: 99px;
    }

    .date {
      font-size: 14px;
      letter-spacing: 1.5px;
      color: #888888;
    }

    @media (max-width: 600px) {
      body {
        padding: 18px;
      }

      .card {
        padding: 44px 22px;
        border-radius: 20px;
      }

      h1 {
        letter-spacing: -1.2px;
      }

      .icon {
        width: 56px;
        height: 56px;
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="icon">⌁</div>

    <h1>Arşivlendi.</h1>

    <p>
      Bazı şeyler silinmez.<br>
      Sadece artık burada tutulmaz.
    </p>

    <div class="divider"></div>

    <div class="date">
      2024 — 2026
    </div>

  </main>

</body>
</html>
